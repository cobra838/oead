name: release

on:
  workflow_dispatch:

jobs:
  resolve_tag:
    name: Resolve latest tag
    runs-on: ubuntu-latest
    outputs:
      tag: ${{ steps.tag.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
      - id: tag
        run: echo "tag=$(git describe --tags --abbrev=0)" >> "$GITHUB_OUTPUT"

  build_sdist:
    name: Make SDist
    needs: resolve_tag
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v7
      with:
        ref: ${{ needs.resolve_tag.outputs.tag }}
        submodules: recursive

    - name: Build SDist
      run: pipx run build --sdist

    - uses: actions/upload-artifact@v7
      with:
        name: sdist
        path: dist/*.tar.gz


  build_wheels:
    name: Build wheels on ${{ matrix.os }}
    needs: resolve_tag
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        # Universal wheels error on Mac, so use macos-latest for arm
        os: [ubuntu-latest, windows-latest, macos-latest]
    env:
      MACOSX_DEPLOYMENT_TARGET: "10.14"
      CIBW_ARCHS: auto64
      CIBW_SKIP: cp36-* cp37-* cp38-macosx_arm64

    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.resolve_tag.outputs.tag }}
          submodules: recursive

      - uses: actions/setup-python@v7

      - name: Build wheels
        uses: pypa/cibuildwheel@v4.1.1

      - uses: actions/upload-artifact@v7
        with:
          name: wheel-${{ matrix.os }}
          path: ./wheelhouse/*.whl


  upload_release_assets:
    needs: [resolve_tag, build_wheels, build_sdist]
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v8
        with:
          name: sdist
          path: dist

      - uses: actions/download-artifact@v8
        with:
          pattern: wheel-*
          path: dist
          merge-multiple: true

      - name: Upload release assets
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          RELEASE_TAG: ${{ needs.resolve_tag.outputs.tag }}
        run: |
          gh release view "$RELEASE_TAG" || gh release create "$RELEASE_TAG" --title "$RELEASE_TAG" --generate-notes
          gh release upload "$RELEASE_TAG" dist/* --clobber

      - name: Trigger documentation build
        run: curl -X POST -d "branches=latest" -d "token=${{ secrets.RTD_TOKEN }}" https://readthedocs.org/api/v2/webhook/oead/112051/
